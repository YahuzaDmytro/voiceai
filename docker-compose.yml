services:
    postgres:
        image: postgres:17
        container_name: winshark-db
        restart: unless-stopped
        volumes:
            - postgres:/var/lib/postgresql
        environment:
            POSTGRES_DB: winshark
            POSTGRES_USER: homestead
            POSTGRES_PASSWORD: secret
        ports:
            - 42323:5432
    postgres-testing:
        image: postgres:17
        container_name: winshark-testing-db
        restart: unless-stopped
        volumes:
            - postgres:/var/lib/postgresql
        environment:
            POSTGRES_DB: testing
            POSTGRES_USER: homestead
            POSTGRES_PASSWORD: secret
        ports:
            - 22233:5432
    redis:
        image: redis:4-alpine
        container_name: winshark-redis
        restart: unless-stopped
        ports:
            - 27379:6379
        volumes:
            - redis:/data
volumes:
    postgres:
        driver: "local"
    redis:
        driver: "local"
